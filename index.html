function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return h;
}

function getTagStyle(label) {
  if (!label) return "bg-slate-100 text-slate-400 border-slate-200";
  return PALETTE[hashStr(label) % PALETTE.length];
}

function tagLabel(ev) {
  if (ev.dept && ev.grade) return `${ev.dept} ${ev.grade}`;
  return ev.dept || ev.grade || "전체";
}

const pad2 = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const sameDay = (a, b) => ymd(a) === ymd(b);
const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
const addMonths = (d, n) => { const r = new Date(d); r.setMonth(r.getMonth() + n); return r; };
const startOfWeekMon = (d) => { const r = new Date(d); const day = r.getDay(); const diff = day === 0 ? -6 : 1 - day; return addDays(r, diff); };

function getMonthDays(viewDate) {
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const lastDate = new Date(year, month + 1, 0).getDate();
  const days = [];
  for (let d = 1; d <= lastDate; d++) days.push(new Date(year, month, d));
  return days;
}

function getWeekdays(anchor) {
  const mon = startOfWeekMon(anchor);
  return [0, 1, 2, 3, 4].map((i) => addDays(mon, i));
}

function getHolidayName(dateStr, customHolidays) {
  if (customHolidays && customHolidays[dateStr]) return customHolidays[dateStr];
  if (FIXED_HOLIDAYS[dateStr]) return FIXED_HOLIDAYS[dateStr];
  const mmdd = dateStr.slice(5);
  if (FIXED_HOLIDAYS[mmdd]) return FIXED_HOLIDAYS[mmdd];
  return null;
}

function parseCSV(text) {
  const lines = text.split(/\r\n|\n/);
  const result = [];
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    const row = [];
    let insideQuotes = false;
    let entry = '';
    for (let j = 0; j < line.length; j++) {
      const char = line[j];
      if (char === '"') {
        insideQuotes = !insideQuotes;
      } else if (char === ',' && !insideQuotes) {
        row.push(entry.trim());
        entry = '';
      } else {
        entry += char;
      }
    }
    row.push(entry.trim());
    result.push(row);
  }
  return result;
}

function sortEvents(events) {
  const gradeOrder = GRADES;
  return [...events].sort((a, b) => {
    const isAAll = !a.dept && !a.grade;
    const isBAll = !b.dept && !b.grade;

    if (isAAll && !isBAll) return -1;
    if (!isAAll && isBAll) return 1;
    if (isAAll && isBAll) {
      return (a.content || "").localeCompare(b.content || "", "ko");
    }

    const hasADept = !!a.dept;
    const hasBDept = !!b.dept;

    if (hasADept && !hasBDept) return -1;
    if (!hasADept && hasBDept) return 1;

    if (hasADept && hasBDept) {
      const deptCompare = (a.dept || "").localeCompare(b.dept || "", "ko");
      if (deptCompare !== 0) return deptCompare;
      return (a.content || "").localeCompare(b.content || "", "ko");
    }

    const gradeIdxA = gradeOrder.indexOf(a.grade);
    const gradeIdxB = gradeOrder.indexOf(b.grade);
    const safeIdxA = gradeIdxA !== -1 ? gradeIdxA : 999;
    const safeIdxB = gradeIdxB !== -1 ? gradeIdxB : 999;

    if (safeIdxA !== safeIdxB) {
      return safeIdxA - safeIdxB;
    }

    return (a.content || "").localeCompare(b.content || "", "ko");
  });
}

function DateRow({ date, today, events, isLast, onAddEvent, onOpenEvent, customHolidays, selectedEventIds, onToggleSelectEvent, onToggleSelectDate, isDateSelected }) {

  const dow = date.getDay();

  const holidayName = getHolidayName(dateStr, customHolidays);

  const rowBg = isToday ? "bg-emerald-50/70" : isHoliday ? "bg-rose-50/40" : dow === 6 ? "bg-blue-50/30" : "bg-white";
  const dateColor = isToday ? "text-emerald-600" : isHoliday ? "text-rose-500 font-black" : dow === 6 ? "text-blue-400" : "text-slate-500";

  const sortedEvents = sortEvents(events);

  return (
    <div className={`flex gap-3 border-b border-slate-100 px-3 py-2.5 sm:px-4 min-h-[52px] ${rowBg} ${isLast ? "border-b-0" : ""}`}>

        <div className="flex items-center gap-1.5 mb-1">
          <input
            type="checkbox"
            checked={isDateSelected}
            onChange={() => onToggleSelectDate(dateStr, events)}
            className="h-3.5 w-3.5 rounded border-slate-300 text-violet-600 focus:ring-violet-400 cursor-pointer shrink-0"
            title="이 날짜 전체 선택"
          />
        </div>
        <div className="flex items-center gap-1 text-sm font-extrabold">
          {date.getDate()}
          <span className="text-xs font-bold">({WEEKDAY_KOR[dow]})</span>
        </div>
        {holidayName && (
          <span className="mt-0.5 inline-block text-[10px] font-bold leading-tight text-rose-500 break-keep">
            {holidayName}
          </span>
        )}
      </div>
      <div className="min-w-0 flex-1 space-y-1.5">
        {sortedEvents.length === 0 ? (
          <p className="pt-0.5 text-xs text-slate-300">-</p>
        ) : (
          sortedEvents.map((ev) => {
            const isChecked = selectedEventIds.has(ev.id);
            return (
              <div key={ev.id} className="flex items-center gap-2 group">
                <input
                  type="checkbox"
                  checked={isChecked}
                  onChange={() => onToggleSelectEvent(ev.id)}
                  className="h-4 w-4 rounded border-slate-300 text-violet-600 focus:ring-violet-400 cursor-pointer shrink-0"
                  title="개별 일정 선택"
                />
                <button onClick={() => onOpenEvent(ev)} className="flex flex-1 items-center gap-2 rounded-lg px-1 py-0.5 text-left hover:bg-slate-100/85 transition min-w-0">
                  <Badge className={getTagStyle(tagLabel(ev))}>{tagLabel(ev)}</Badge>
                  <span className="pt-0.5 text-[13px] leading-snug text-slate-700 font-medium truncate">{ev.content}</span>
                  {ev.manager && (
                    <span className="ml-auto shrink-0 pt-0.5 text-[13px] leading-snug text-slate-700 font-medium pl-2">
                      {ev.manager}
                    </span>
                  )}
                </button>
              </div>
            );
          })
        )}
      </div>
      <button onClick={() => onAddEvent(dateStr)} className="flex h-6 w-6 shrink-0 items-center justify-center self-start rounded-full text-slate-300 transition hover:bg-violet-100 hover:text-violet-500" title="이 날짜에 일정 추가">
        <PlusIcon size={16} />
      </button>
    </div>
  );
}

function FilterRow({ label, items, selected, onToggle, onAll, onNone, editAction, groupNames, onSelectGroup }) {
  return (
    <div>
      <div className="mb-2.5 flex items-center justify-between">
        <div className="flex items-center gap-2">
          <span className="text-xs font-bold text-slate-500">{label}</span>
          {editAction}
        </div>
        <div className="flex flex-wrap items-center gap-2">
          {groupNames && groupNames.map((name, idx) => (
            name.trim() && (
              <button 
                key={idx} 
                onClick={() => onSelectGroup(idx)} 
                className="rounded-xl border border-violet-200 bg-violet-50 px-3.5 py-1.5 text-xs font-bold text-violet-700 hover:bg-violet-100 hover:border-violet-300 shadow-2xs transition inline-flex items-center whitespace-nowrap shrink-0"
              >
                {name}
              </button>
            )
          ))}
          <div className="ml-1 flex gap-1 border-l border-slate-200 pl-2 shrink-0">
            <button onClick={onAll} className="rounded-lg bg-slate-100 px-2.5 py-1 text-[11px] font-semibold text-slate-500 hover:bg-slate-200">일괄 선택</button>
            <button onClick={onNone} className="rounded-lg bg-slate-100 px-2.5 py-1 text-[11px] font-semibold text-slate-500 hover:bg-slate-200">일괄 해제</button>
          </div>
        </div>
      </div>
      <div className="flex flex-wrap gap-1.5">
        {items.map((item) => {
          const active = selected.has(item);
          return (
            <button key={item} onClick={() => onToggle(item)} className={`rounded-full border px-2.5 py-1 text-xs font-semibold transition ${active ? getTagStyle(item) : "border-slate-200 bg-white text-slate-300 hover:text-slate-400"}`}>
              {item}
            </button>
          );
        })}
      </div>
    </div>
  );
}

      ["2026-10-01", "교무기획", "전체", "10월 개교기념일 행사(09:00~, 강당)", "홍길동", "1234"],
      ["2026-10-02", "교육정보", "5학년", "학교폭력예방교육(1~3교시)", "김철수", "1234"],
      ["2026-10-05", "관리자근무", "관리자", "서구청 출장협의회", "교장", "교감(교무)"],
      ["2026-10-07", "학생생활", "전체", "학교폭력예방 특별교육", "이영희", "1234"]
    ];
    const csvString = sampleRows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\r\n");
    const blob = new Blob(["\uFEFF" + csvString], { type: "text/csv;charset=utf-8;" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.setAttribute("download", "경연초_학사일정_업로드_양식.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };

  const handleFileUpload = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (event) => {
      try {
        const text = event.target.result;
        const rows = parseCSV(text);
        if (rows.length <= 1) {
          setUploadStatus("파일에 데이터가 없습니다.");
          return;
        }

        const parsedEvents = [];
        const adminUpdatesToProcess = [];

        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          if (!row || row.length === 0) continue;
          const rawDate = row[0] || "";
          const dept = row[1] || "";
          const grade = row[2] || "";
          const content = row[3] || "";
          const manager = row[4] || "";
          const col5 = row[5] || "1234";

          let dateStr = rawDate.replace(/\./g, "-").replace(/\//g, "-").trim();
          if (/^\d{4}-\d{1,2}-\d{1,2}$/.test(dateStr)) {
            const parts = dateStr.split("-");
            dateStr = `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
          }

          if (dateStr && content.trim()) {
            if (dept === "관리자근무" || adminRoles.includes(col5)) {
              const targetRole = adminRoles.includes(col5) ? col5 : adminRoles[1] || "교감(교무)";
              const d = new Date(dateStr);
              if (!isNaN(d.getTime())) {
                const wKey = ymd(startOfWeekMon(d));
                const dayStr = `${d.getDate()}(${WEEKDAY_KOR[d.getDay()]})`;
                adminUpdatesToProcess.push({ weekKey: wKey, role: targetRole, content: `${dayStr} ${content.trim()}` });
              }
            } else {
              parsedEvents.push({
                id: Math.floor(Date.now() % 2147483647) + i,
                date: dateStr,
                dept: dept === "전체" ? "" : dept,
                grade: grade === "전체" ? "" : grade,
                content: content.trim(),
                manager: manager.trim(),
                password: col5.replace(/\D/g, "").slice(0, 4) || "1234"
              });
            }
          }
        }

        if (parsedEvents.length > 0 && supabase) {
          await supabase.from('events').insert(parsedEvents);
          setEvents(prev => [...prev, ...parsedEvents]);
        }

        if (adminUpdatesToProcess.length > 0) {
          const updatedMap = { ...adminWorkStatus };
          const weekKeysToUpsert = new Set();
          adminUpdatesToProcess.forEach(up => {
            weekKeysToUpsert.add(up.weekKey);
            const curData = { ...(updatedMap[up.weekKey] || {}) };
            const oldVal = curData[up.role] && curData[up.role] !== "특이사항 없음" ? curData[up.role].trim() : "";
            if (oldVal) {
              if (!oldVal.includes(up.content)) curData[up.role] = `${oldVal}\n${up.content}`;
            } else {
              curData[up.role] = up.content;
            }
            updatedMap[up.weekKey] = curData;
          });

          if (supabase) {
            const upsertRows = Array.from(weekKeysToUpsert).map(wk => ({
              week_key: wk,
              data: updatedMap[wk]
            }));
            await supabase.from('admin_status').upsert(upsertRows);
          }
          setAdminWorkStatus(updatedMap);
        }

        alert(`엑셀 업로드 완료! (일정 ${parsedEvents.length}개, 관리자 근무 ${adminUpdatesToProcess.length}개 등록됨)`);

  const handlePrint = () => {
    const isMonth = tab === "month";
    const activeDays = isMonth ? monthDays : weekDates;
    const currentNoticeText = (notices[currentPeriodKey] || "").trim();

    const escapeToExcelCell = (str) => {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/\r\n|\n|\r/g, '<br style="mso-data-placement:same-cell;" />');
    };

    const getSmartAdminRemarkForDate = (dateObj) => {
      const monDate = startOfWeekMon(dateObj);
      const wKey = ymd(monDate);
      const weekAdminData = adminWorkStatus[wKey] || {};
      const targetDayNum = dateObj.getDate();

      const items = [];

      adminRoles.forEach(role => {
        const text = weekAdminData[role];
        if (text && text !== "특이사항 없음") {
          const lines = text.split(/\r\n|\n/);
          lines.forEach(line => {
            const tLine = line.trim();
            if (!tLine) return;

            const match = tLine.match(/^(\d{1,2})\s*\(([월화수목금토일])\)/);
            if (match && parseInt(match[1], 10) === targetDayNum) {
              let contentOnly = tLine.replace(/^\d{1,2}\s*\([월화수목금토일]\)\s*/, '').trim();
              if (contentOnly) {
                let timePart = "";
                const timeMatch = contentOnly.match(/^([\d:]+~[\d:]+)\s+(.+)$/);
                if (timeMatch) {
                  timePart = timeMatch[1];
                  contentOnly = timeMatch[2];
                }

                let desc = contentOnly;
                let location = "";
                if (contentOnly.includes(",")) {
                  const parts = contentOnly.split(",");
                  desc = parts[0].trim();
                  location = parts.slice(1).join(",").trim();
                }

                let cleanRole = role;
                if (role.includes("교장")) cleanRole = "교장";
                else if (role.includes("교감")) cleanRole = "교감";

                items.push({ time: timePart, desc, location, role: cleanRole, rawRole: role });
              }
            }
          });
        }
      });

      if (items.length === 0) return "";

      const grouped = [];
      const 교감items = items.filter(i => i.role === "교감");
      const 기타items = items.filter(i => i.role !== "교감");

      if (교감items.length === 2) {
        const [g1, g2] = 교감items;
        if (g1.time === g2.time && g1.desc === g2.desc && g1.location === g2.location) {
          grouped.push({ time: g1.time, desc: g1.desc, location: g1.location, displayRole: "교감" });
        } else {
          grouped.push({ time: g1.time, desc: g1.desc, location: g1.location, displayRole: g1.rawRole.includes("교무") ? "교감(교무)" : "교감(생활)" });
          grouped.push({ time: g2.time, desc: g2.desc, location: g2.location, displayRole: g2.rawRole.includes("교무") ? "교감(교무)" : "교감(생활)" });
        }
      } else {
        교감items.forEach(i => {
          grouped.push({ time: i.time, desc: i.desc, location: i.location, displayRole: i.rawRole.includes("교무") ? "교감(교무)" : i.rawRole.includes("생활") ? "교감(생활)" : "교감" });
        });
      }

      기타items.forEach(i => {
        grouped.push({ time: i.time, desc: i.desc, location: i.location, displayRole: i.rawRole });
      });

      const locations = Array.from(new Set(grouped.map(i => i.location).filter(Boolean)));
      const lines = [];

      grouped.forEach(i => {
        const timePrefix = i.time ? `${i.time} ` : "";
        if (locations.length === 1 && i.location) {
          lines.push(`${timePrefix}${i.desc} ${i.displayRole}`);
        } else {
          const locStr = i.location ? `, ${i.location}` : "";
          lines.push(`${timePrefix}${i.desc}${locStr} ${i.displayRole}`);
        }
      });

      if (locations.length === 1 && locations[0]) {
        lines.push(locations[0]);
      } else if (locations.length > 1) {
        locations.forEach(loc => lines.push(loc));
      }

      return lines.join("\n");
    };

    let htmlTableContent = `
      <html xmlns:o="urn:schemas-microsoft-com:office:office"
            xmlns:x="urn:schemas-microsoft-com:office:excel"
            xmlns="http://www.w3.org/1999/xhtml">
      <head>
        <meta http-equiv="content-type" content="text/html; charset=UTF-8">
        <!--[if gte mso 9]>
        <xml>
          <x:ExcelWorkbook>
            <x:ExcelWorksheets>
              <x:ExcelWorksheet>
                <x:Name>학사일정</x:Name>
                <x:WorksheetOptions>
                  <x:DisplayGridlines/>
                </x:WorksheetOptions>
              </x:ExcelWorksheet>
            </x:ExcelWorksheets>
          </x:ExcelWorkbook>
        </xml>
        <![endif]-->
        <style>
          table { border-collapse: collapse; width: 100%; table-layout: fixed; }
          th, td {
            border: 0.5pt solid #999;
            padding: 6px;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            font-size: 11pt;
            vertical-align: middle;
            mso-data-placement: same-cell;
            white-space: pre-wrap;
          }
          th { background-color: #f2f2f2; font-weight: bold; vertical-align: middle; }
          .col-date { width: 45px; text-align: center; font-size: 10pt; vertical-align: middle; }
          .col-dow { width: 50px; text-align: center; font-size: 10pt; vertical-align: middle; }
          .col-content { width: 680px; text-align: left; }
          .col-manager { width: 100px; text-align: center; font-size: 10pt; }
          .col-remark { width: 140px; text-align: center; font-size: 7pt; color: #1e293b; line-height: 1.3; }
          
          .th-date { text-align: center; }
          .th-dow { text-align: center; }
          .th-content { text-align: center; font-size: 11pt; }
          .th-manager { text-align: center; }
          .th-remark { text-align: center; font-size: 11pt; }

          .notice-title-cell { text-align: center; font-weight: bold; background-color: #f9fafb; font-size: 10pt; vertical-align: middle; }
          .notice-content-cell { text-align: left; vertical-align: middle; }

          .title { font-size: 16pt; font-weight: bold; text-align: center; border: none; padding-bottom: 15px; }
        </style>
      </head>
      <body>
        <table>
          <tr><td colspan="5" class="title">${isMonth ? `인천경연초등학교 ${monthLabel} 학사 일정표` : `인천경연초등학교 주간 업무 및 근무 현황 (${weekLabel})`}</td></tr>
          <tr>
            <th class="col-date th-date">일자</th>
            <th class="col-dow th-dow">요일</th>
            <th class="col-content th-content">내용</th>
            <th class="col-manager th-manager">담당자</th>
            <th class="col-remark th-remark">비고</th>
          </tr>
    `;

    activeDays.forEach(d => {
      const dayNum = d.getDate();
      const dowStr = WEEKDAY_KOR[d.getDay()];
      const dStr = ymd(d);
      const hol = getHolidayName(dStr, customHolidays) || "";
      const evList = sortEvents(eventsByDate[dStr] || []);

      let contentRaw = "";
      let managerRaw = "";

      if (evList.length === 0) {
        contentRaw = hol ? `[휴일] ${hol}` : "";
        managerRaw = "";
      } else {
        const contents = [];
        const managers = [];

        evList.forEach(ev => {
          const cleanText = (ev.content || "").replace(/^\[.*?\]\s*/, "").trim();
          contents.push(cleanText);
          managers.push(ev.manager && ev.manager.trim() ? ev.manager.trim() : "-");
        });

        contentRaw = contents.join("\n");
        managerRaw = managers.join("\n");
      }

      const remarkRaw = getSmartAdminRemarkForDate(d);

      htmlTableContent += `
          <tr>
            <td class="col-date">${dayNum}</td>
            <td class="col-dow">${dowStr}</td>
            <td class="col-content">${escapeToExcelCell(contentRaw)}</td>
            <td class="col-manager">${escapeToExcelCell(managerRaw)}</td>
            <td class="col-remark">${escapeToExcelCell(remarkRaw)}</td>
          </tr>
      `;
    });

    if (currentNoticeText) {
      htmlTableContent += `
          <tr>
            <td colspan="2" class="notice-title-cell">공지사항 및 협의 사항</td>
            <td colspan="3" class="notice-content-cell">${escapeToExcelCell(currentNoticeText)}</td>
          </tr>
      `;
    }

    htmlTableContent += `</table></body></html>`;

    const blob = new Blob(["\uFEFF" + htmlTableContent], {
      type: "application/vnd.ms-excel;charset=utf-8;"
    });
    const link = document.createElement("a");
    const fileName = isMonth
      ? `인천경연초_행사계획_${viewDate.getFullYear()}년_${viewDate.getMonth() + 1}월.xls`
      : `인천경연초_주간업무계획_${weekLabel.replace(/[\/\s~]/g, "_")}.xls`;

    link.href = URL.createObjectURL(blob);
    link.setAttribute("download", fileName);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    setTimeout(() => URL.revokeObjectURL(link.href), 0);
  };

  const handleDownloadExcel = () => {
    handlePrint();
  };

  const toggleInSet = (set, setter, value) => {
    const next = new Set(set);
    if (next.has(value)) next.delete(value);
    else next.add(value);
    setter(next);

  const saveEvent = async () => {

        if (error) { setPwCheckError("DB 수정 실패: " + error.message); return; }
      }
      setEvents((prev) => prev.map((e) => (e.id === eventModal.data.id ? { ...e, ...form } : e)));

  const deleteEvent = async () => {
    if (pwCheckInput !== eventModal.data.password && pwCheckInput !== masterPassword) {
      setPwCheckError("비밀번호가 일치하지 않습니다.");

    setEvents((prev) => prev.filter((e) => e.id !== eventModal.data.id));
    closeEventModal();
  };

  const openMasterPwModal = () => {
    setCurrentPwInput(""); setNewPwInput(""); setNewPwConfirmInput(""); setMasterPwError(""); setMasterPwSuccess("");
    setMasterPwModalOpen(true);
  };

  const handleSaveMasterPassword = () => {
    setMasterPwError(""); setMasterPwSuccess("");
    if (currentPwInput !== masterPassword) { setMasterPwError("현재 마스터 비밀번호가 일치하지 않습니다."); return; }

      setTimeout(() => { setMasterPwModalOpen(false); }, 1200);
    }
  };

  const openAdminInput = (role = 'ALL') => {
    setAdminTargetRole(role);
    setAdminTargetDate(tab === "week" ? ymd(weekStart) : ymd(today));
    setAdminSharedRoles(new Set());
    setAdminCurrentInput("");
    setStagedAdminItems([]);
    setAdminPwInput("");
    setAdminPwError("");
    setAdminModalStage("password");
  };

  const submitAdminPassword = () => {
    if (adminPwInput !== masterPassword) { setAdminPwError("비밀번호가 일치하지 않습니다."); return; }
    const targetWKey = weekKey;
    const savedData = adminWorkStatus[targetWKey] || {};
    
    if (adminTargetRole === 'ALL') {
      const base = {};
      adminRoles.forEach((r) => {
        const val = savedData[r];
        base[r] = (val && val !== "특이사항 없음") ? val : "";
      });
      setAdminFormTexts(base);
    } else {
      const val = savedData[adminTargetRole];
      setAdminFormTexts({
        [adminTargetRole]: (val && val !== "특이사항 없음") ? val : ""
      });
      setAdminCurrentInput("");
      setStagedAdminItems([]);
      setAdminSharedRoles(new Set());
    }
    setAdminModalStage("edit");
  };

  const formatTextWithGivenDate = (rawText, dateStr) => {
    const trimmed = (rawText || "").trim();
    if (!trimmed) return "";
    try {
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return trimmed;
      const dayStr = `${d.getDate()}(${WEEKDAY_KOR[d.getDay()]})`;
      if (/^\d{1,2}\s*\([월화수목금토일]\)/.test(trimmed)) return trimmed;
      return `${dayStr} ${trimmed}`;
    } catch { return trimmed; }
  };

  const stageCurrentAdminItem = () => {

    if (!trimmed) return;
    const formatted = formatTextWithGivenDate(trimmed, adminTargetDate);
    const d = new Date(adminTargetDate);

    const sharedArr = Array.from(adminSharedRoles);
    setStagedAdminItems(prev => [
      ...prev,
      {

        date: adminTargetDate,
        weekKey: wKey,
        role: adminTargetRole,
        sharedRoles: sharedArr,
        content: formatted
      }
    ]);
    setAdminCurrentInput("");
  };

  const removeStagedItem = (id) => {

  };

  const saveAdminTexts = async () => {

    const updatedMap = { ...adminWorkStatus };
    const curData = { ...(updatedMap[targetWKey] || {}) };

    if (adminTargetRole === 'ALL') {
      adminRoles.forEach(r => {
        const text = (adminFormTexts[r] || "").trim();
        curData[r] = text ? text : "특이사항 없음";
      });
      updatedMap[targetWKey] = curData;

      if (supabase) {

      }
      setAdminWorkStatus(updatedMap);
      setAdminModalStage(null);

    }

    let itemsToProcess = [...stagedAdminItems];
    if (adminCurrentInput.trim()) {
      const formatted = formatTextWithGivenDate(adminCurrentInput.trim(), adminTargetDate);
      const d = new Date(adminTargetDate);
      const wKey = ymd(startOfWeekMon(d));
      const sharedArr = Array.from(adminSharedRoles);
      itemsToProcess.push({

      });

    if (itemsToProcess.length === 0) {
      curData[adminTargetRole] = directText ? directText : "특이사항 없음";
    } else {
      const targetRoles = [adminTargetRole, ...Array.from(adminSharedRoles)];

      <div className="mx-auto max-w-3xl">
        {(!supabase) && (

                <button 
                  onClick={() => setHolidayCalendarDate(prev => addMonths(prev, -1))}

                  <ChevronLeft size={16} />
                </button>

                <div className="grid grid-cols-7 gap-1 text-center">
                  {(() => {
                    const y = holidayCalendarDate.getFullYear();
                    const m = holidayCalendarDate.getMonth();
                    const firstDayIdx = new Date(y, m, 1).getDay();
                    const lastDate = new Date(y, m + 1, 0).getDate();
                    const cells = [];

                    for (let i = 0; i < firstDayIdx; i++) {
                      cells.push(<div key={`empty-${i}`} className="h-8"></div>);
                    }

                    for (let d = 1; d <= lastDate; d++) {
                      const dObj = new Date(y, m, d);
                      const dStr = ymd(dObj);
                      const isSelected = selectedHolidayDate === dStr;
                      const hasHol = !!customHolidays[dStr];
                      const dow = dObj.getDay();

                      cells.push(
                        <button
                          key={dStr}
                          onClick={() => {
                            setSelectedHolidayDate(dStr);
                            if (hasHol) setHolidayNameInput(customHolidays[dStr]);
                          }}
                          className={`h-9 rounded-lg text-xs font-bold flex flex-col items-center justify-center transition relative ${
                            isSelected 
                              ? "bg-rose-600 text-white shadow-sm ring-2 ring-rose-300" 
                              : hasHol 
                              ? "bg-rose-100 text-rose-700 hover:bg-rose-200 border border-rose-300" 
                              : dow === 0 
                              ? "text-rose-500 hover:bg-slate-100" 
                              : dow === 6 
                              ? "text-blue-500 hover:bg-slate-100" 
                              : "text-slate-700 hover:bg-slate-100"
                          }`}
                        >
                          <span>{d}</span>

                    localStorage.setItem("sp_custom_holidays", JSON.stringify(updated));

                      await supabase.from('admin_status').upsert([{ week_key: 'custom_holidays_data', data: updated }]);

                    alert(`${selectedHolidayDate}일이 '${holidayNameInput.trim()}'(으)로 등록되었습니다.`);

              </div>

            </div>

                    <textarea value={adminFormTexts[role] || ""} onChange={(e) => setAdminFormTexts({ ...adminFormTexts, [role]: e.target.value })} rows={2} className={inputCls} placeholder="예) 28(금) 출장" />
                  </div>
                ))}
              </div>
            )}

            <div className="mt-4 flex items-center gap-2">
              <button onClick={closeAdminModal} className="flex-1 rounded-xl border border-slate-200 bg-white py-2.5 text-sm font-bold text-slate-500 hover:bg-slate-50 transition">취소</button>
              <button onClick={saveAdminTexts} className="flex-1 rounded-xl bg-violet-600 py-2.5 text-sm font-bold text-white hover:bg-violet-700 transition shadow-md shadow-violet-200">
                {stagedAdminItems.length > 0 ? `일괄 저장 (${stagedAdminItems.length + (adminCurrentInput.trim() ? 1 : 0)}개)` : "저장 완료"}
              </button>
            </div>
          </Modal>
        )}

        {/* 8. 부서명 수정 인증 모달 */}
        {deptModalStage === "password" && (
          <Modal title="마스터 인증" onClose={closeDeptModal}>
            <FieldLabel>마스터 비밀번호</FieldLabel>
            <input type="password" autoFocus value={deptPwInput} onChange={(e) => setDeptPwInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submitDeptPassword()} className={inputCls} placeholder="비밀번호를 입력하세요" />
            {deptPwError && <p className="mt-2 text-xs font-semibold text-rose-500">{deptPwError}</p>}
            <button onClick={submitDeptPassword} className="mt-4 w-full rounded-xl bg-violet-500 py-2.5 text-sm font-bold text-white hover:bg-violet-600 transition">확인</button>
            <p className="mt-2 text-center text-[11px] text-slate-300">기본 마스터 비밀번호: {MASTER_PASSWORD_DEFAULT}</p>
          </Modal>
        )}

        {/* 9. 부서명 수정 편집 모달 */}
        {deptModalStage === "edit" && (
          <Modal title="담당 부서명 수정" onClose={closeDeptModal} wide>
            <div className="max-h-[55vh] space-y-2 overflow-y-auto pr-1">
              {deptEditRows.map((row) => (
                <div key={row.key} className="flex items-center gap-2">
                  <input type="text" value={row.value} onChange={(e) => updateDeptRow(row.key, e.target.value)} className={inputCls} placeholder="부서명" />
                  <button onClick={() => removeDeptRow(row.key)} title="이 부서 삭제" className="shrink-0 rounded-lg p-2 text-slate-300 hover:bg-rose-50 hover:text-rose-500 transition"><XIcon size={16} /></button>
                </div>
              ))}
            </div>
            <button onClick={addDeptRow} className="mt-2 flex w-full items-center justify-center gap-1 rounded-xl border border-dashed border-slate-200 py-2 text-xs font-bold text-slate-400 hover:border-violet-300 hover:text-violet-500 transition"><PlusIcon size={14} /> 부서 추가</button>
            <p className="mt-2 text-[11px] text-slate-400">* 부서명을 삭제하면 해당 부서로 등록된 일정은 '미지정'으로 변경됩니다.</p>
            <div className="mt-4 flex items-center gap-2">
              <button onClick={closeDeptModal} className="flex-1 rounded-xl border border-slate-200 bg-white py-2.5 text-sm font-bold text-slate-500 hover:bg-slate-50 transition">취소</button>
              <button onClick={saveDeptEdits} className="flex-1 rounded-xl bg-violet-500 py-2.5 text-sm font-bold text-white hover:bg-violet-600 transition">저장</button>
            </div>
          </Modal>
        )}

        {/* 10. 필터 그룹 (업무 분장) 수정 모달 */}
        {groupModalStage === "password" && (
          <Modal title="필터 그룹 설정 인증" onClose={() => setGroupModalStage(null)}>
            <FieldLabel>마스터 비밀번호</FieldLabel>
            <input type="password" autoFocus value={groupPwInput} onChange={(e) => setGroupPwInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submitGroupPassword()} className={inputCls} placeholder="마스터 비밀번호 입력" />
            {groupPwError && <p className="mt-2 text-xs font-semibold text-rose-500">{groupPwError}</p>}
            <button onClick={submitGroupPassword} className="mt-4 w-full rounded-xl bg-violet-500 py-2.5 text-sm font-bold text-white hover:bg-violet-600 transition">확인</button>
          </Modal>
        )}

        {groupModalStage === "edit" && (
          <Modal title="필터 그룹 (업무 분장) 설정" onClose={() => setGroupModalStage(null)} wide>
            <div className="max-h-[65vh] space-y-6 overflow-y-auto pr-1">
              
              {/* 그룹 1 설정 */}
              <div className="rounded-2xl border border-violet-100 bg-violet-50/40 p-4 space-y-4">
                <div className="space-y-1.5">
                  <span className="text-xs font-extrabold text-violet-700">1번 그룹 명칭 (메인 화면 버튼명)</span>
                  <input 
                    type="text" 
                    value={editGroups.names.group1} 
                    onChange={(e) => handleEditGroupName('group1', e.target.value)} 
                    className="w-full rounded-xl border border-violet-200 bg-white px-3.5 py-2 text-sm font-bold text-violet-800 outline-none focus:border-violet-400 shadow-2xs" 
                    placeholder="예: 교감(A) 소관" 
                  />
                </div>

                <div className="space-y-2">
                  <p className="text-[11px] font-bold text-slate-600">소속 학년 지정</p>
                  <div className="flex flex-wrap gap-1.5">
                    {GRADES.map(item => {
                      const isActive = (editGroups.mappings.group1.grades || []).includes(item);
                      return (
                        <button key={item} onClick={() => handleEditGroupMapping('group1', 'grades', item)} className={`rounded-full border px-2.5 py-1 text-[11px] font-semibold transition ${isActive ? getTagStyle(item) : "border-slate-300 bg-white text-slate-400 hover:text-slate-600"}`}>
                          {isActive && "✓"} {item}
                        </button>
                      );
                    })}
                  </div>
                </div>

                <div className="space-y-2 pt-2 border-t border-violet-100">
                  <p className="text-[11px] font-bold text-slate-600">소속 담당 부서 지정</p>
                  <div className="flex flex-wrap gap-1.5">
                    {depts.map(item => {
                      const isActive = (editGroups.mappings.group1.depts || []).includes(item);
                      return (
                        <button key={item} onClick={() => handleEditGroupMapping('group1', 'depts', item)} className={`rounded-full border px-2.5 py-1 text-[11px] font-semibold transition ${isActive ? getTagStyle(item) : "border-slate-300 bg-white text-slate-400 hover:text-slate-600"}`}>
                          {isActive && "✓"} {item}
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>

              {/* 그룹 2 설정 */}
              <div className="rounded-2xl border border-sky-100 bg-sky-50/40 p-4 space-y-4">
                <div className="space-y-1.5">
                  <span className="text-xs font-extrabold text-sky-700">2번 그룹 명칭 (메인 화면 버튼명)</span>
                  <input 
                    type="text" 
                    value={editGroups.names.group2} 
                    onChange={(e) => handleEditGroupName('group2', e.target.value)} 
                    className="w-full rounded-xl border border-sky-200 bg-white px-3.5 py-2 text-sm font-bold text-sky-800 outline-none focus:border-sky-400 shadow-2xs" 
                    placeholder="예: 교감(B) 소관" 
                  />
                </div>

                <div className="space-y-2">
                  <p className="text-[11px] font-bold text-slate-600">소속 학년 지정</p>
                  <div className="flex flex-wrap gap-1.5">
                    {GRADES.map(item => {
                      const isActive = (editGroups.mappings.group2.grades || []).includes(item);
                      return (
                        <button key={item} onClick={() => handleEditGroupMapping('group2', 'grades', item)} className={`rounded-full border px-2.5 py-1 text-[11px] font-semibold transition ${isActive ? getTagStyle(item) : "border-slate-300 bg-white text-slate-400 hover:text-slate-600"}`}>
                          {isActive && "✓"} {item}
                        </button>
                      );
                    })}
                  </div>
                </div>

                <div className="space-y-2 pt-2 border-t border-sky-100">
                  <p className="text-[11px] font-bold text-slate-600">소속 담당 부서 지정</p>
                  <div className="flex flex-wrap gap-1.5">
                    {depts.map(item => {
                      const isActive = (editGroups.mappings.group2.depts || []).includes(item);
                      return (
                        <button key={item} onClick={() => handleEditGroupMapping('group2', 'depts', item)} className={`rounded-full border px-2.5 py-1 text-[11px] font-semibold transition ${isActive ? getTagStyle(item) : "border-slate-300 bg-white text-slate-400 hover:text-slate-600"}`}>
                          {isActive && "✓"} {item}
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>

            </div>
            
            <p className="mt-4 text-[11px] text-slate-400 leading-relaxed">
              * 설정한 그룹 버튼을 누르면 해당 그룹에 소속된 학년과 담당 부서가 한 번에 싹 필터링됩니다!
            </p>
            <div className="mt-3 flex items-center gap-2">
              <button onClick={() => setGroupModalStage(null)} className="flex-1 rounded-xl border border-slate-200 bg-white py-2.5 text-sm font-bold text-slate-500 hover:bg-slate-50 transition">취소</button>
              <button onClick={saveGroupEdits} className="flex-1 rounded-xl bg-violet-500 py-2.5 text-sm font-bold text-white hover:bg-violet-600 transition shadow-md">저장 및 적용</button>
            </div>
          </Modal>
        )}

      </div>
    </div>
  );
}

document.getElementById('root') && ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
